version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: autofy_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: autofy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autofy_backend
    restart: always
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@db:5432/autofy
      - PROJECT_NAME=Autofy Backend
      - PORT=8000
    ports:
      - "8000:8000"
    depends_on:
      - db

volumes:
  postgres_data:
