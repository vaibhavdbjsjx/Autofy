services:
  - type: web
    name: autofy-backend
    env: python
    region: singapore
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt && python3 -m alembic upgrade head"
    startCommand: "cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DEBUG
        value: "false"
      - key: PORT
        value: "10000"
      - key: DATABASE_URL
        fromDatabase:
          name: autofy-postgres
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://autofy11.netlify.app
      - key: GOOGLE_REDIRECT_URI
        value: https://autofy-backend.onrender.com/api/v1/auth/google/callback

databases:
  - name: autofy-postgres
    region: singapore
    plan: free
    databaseName: autofydb
    user: autofyuser
